<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MagicColor</title>
  <meta name="description" content="Coloriages magiques à colorier du bout du doigt.">
  <meta name="theme-color" content="#fff4f7">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="MagicColor">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <!-- Mascotte : une goutte de peinture qui sourit -->
      <symbol id="mascot" viewBox="0 0 120 120">
        <path d="M60 10c14 20 38 40 38 64a38 38 0 0 1-76 0c0-24 24-44 38-64z" fill="#f7a8c4"/>
        <path d="M44 40c-6 9-12 18-13 29" stroke="#fff" stroke-width="6" stroke-linecap="round" fill="none" opacity=".7"/>
        <circle cx="47" cy="76" r="5" fill="#3f2a3a"/>
        <circle cx="73" cy="76" r="5" fill="#3f2a3a"/>
        <circle cx="45.5" cy="74.5" r="1.6" fill="#fff"/>
        <circle cx="71.5" cy="74.5" r="1.6" fill="#fff"/>
        <ellipse cx="38" cy="88" rx="6" ry="3.6" fill="#f17aa5" opacity=".75"/>
        <ellipse cx="82" cy="88" rx="6" ry="3.6" fill="#f17aa5" opacity=".75"/>
        <path d="M54 86q6 6 12 0" stroke="#3f2a3a" stroke-width="3.4" stroke-linecap="round" fill="none"/>
      </symbol>
      <symbol id="deco-star" viewBox="0 0 24 24"><path d="M12 2.5c.9 4.6 3.6 7.6 8.5 9.5-4.9 1.9-7.6 4.9-8.5 9.5-.9-4.6-3.6-7.6-8.5-9.5 4.9-1.9 7.6-4.9 8.5-9.5z"/></symbol>
      <symbol id="deco-heart" viewBox="0 0 24 24"><path d="M12 21s-8.5-5.2-8.5-11.2A4.8 4.8 0 0 1 12 7a4.8 4.8 0 0 1 8.5 2.8C20.5 15.8 12 21 12 21z"/></symbol>
      <symbol id="deco-cloud" viewBox="0 0 48 28"><path d="M13 27a10 10 0 0 1-1-20 12 12 0 0 1 22 2 9 9 0 0 1 2 18z"/></symbol>
      <symbol id="deco-flower" viewBox="0 0 24 24"><g><circle cx="12" cy="6" r="4.2"/><circle cx="17.7" cy="10.2" r="4.2"/><circle cx="15.5" cy="17" r="4.2"/><circle cx="8.5" cy="17" r="4.2"/><circle cx="6.3" cy="10.2" r="4.2"/></g><circle cx="12" cy="12" r="3.4" fill="#fff4b8"/></symbol>

      <!-- Icônes (tracés lucide) -->
      <symbol id="i-back" viewBox="0 0 24 24"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></symbol>
      <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></symbol>
      <symbol id="i-more" viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></symbol>
      <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
      <symbol id="i-fit" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
      <symbol id="i-image" viewBox="0 0 24 24"><path d="M16 5h6"/><path d="M19 2v6"/><path d="M21 11.5V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7.5"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/><circle cx="9" cy="9" r="2"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
      <symbol id="i-reset" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></symbol>
      <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M21.2 6.8a1 1 0 0 0-4-4L3.8 16.2a2 2 0 0 0-.5.8l-1.3 4.4a.5.5 0 0 0 .6.6l4.4-1.3a2 2 0 0 0 .8-.5z"/></symbol>
      <symbol id="i-palette" viewBox="0 0 24 24"><circle cx="13.5" cy="6.5" r=".5"/><circle cx="17.5" cy="10.5" r=".5"/><circle cx="8.5" cy="7.5" r=".5"/><circle cx="6.5" cy="12.5" r=".5"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.9 0 1.6-.7 1.6-1.7 0-.4-.2-.8-.4-1.1-.3-.3-.4-.7-.4-1.1a1.6 1.6 0 0 1 1.7-1.7h2c3 0 5.5-2.5 5.5-5.5C22 6 17.5 2 12 2z"/></symbol>
    </defs>
  </svg>

  <div id="app"></div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <noscript>MagicColor a besoin de JavaScript pour fonctionner.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
